# front_web is a vendored tree installed on its own (it is not a member of the root workspace), so the
# root pnpm-workspace.yaml does not apply here and pnpm refuses to run dependency build scripts.
# Electron's install script is the only thing that downloads the app binary, so without this the shell
# installs cleanly and then cannot start.
allowBuilds:
  electron: true
  esbuild: true
  # Windows-only Authenticode helper; this repo packages macOS.
  electron-winstaller: false
  # Pre-existing optional accelerator; the web and desktop builds never invoke it.
  '@swc/core': false

overrides:
  # app-builder-lib@26.17.0 declares @electron/get ^3 but calls the v5-only Cache.ReadWrite enum, so
  # the macOS packaging step dies with "Cannot read properties of undefined (reading 'ReadWrite')"
  # before it downloads anything. v5 keeps the API it uses and adds the enum.
  app-builder-lib>@electron/get: ^5.1.0
