allowBuilds:
  # postinstall only acts when FIREBASE_WEBAPP_CONFIG is set; unused here
  '@firebase/util': false
  '@prisma/engines': true
  # electron's install script is the only thing that fetches the app binary; without it the desktop
  # shell installs cleanly and then fails to start.
  electron: true
  # Windows-only Authenticode helper; this repo packages macOS.
  electron-winstaller: false
  esbuild: true
  # postinstall is a no-op unless a dependent uses protobufjs's legacy version scheme
  protobufjs: false
  prisma: true
minimumReleaseAgeExclude:
  - '@hono/node-server@2.0.10'
# genkit pins zod ^3.23.8 while its own zod-to-json-schema needs ^3.25.28;
# the app's own zod stays v4 (pnpm keeps the two copies separate).
overrides:
  '@genkit-ai/core>zod': ^3.25.28
  '@genkit-ai/telemetry-server>zod': ^3.25.28
  '@genkit-ai/tools-common>zod': ^3.25.28
peerDependencyRules:
  allowedVersions:
    # openai declares a zod v3 peer for its zodResponseFormat helpers, which
    # @genkit-ai/compat-oai never imports; the app's zod stays v4.
    'openai>zod': '^3.23.8 || ^4'
