name: vanlife-api

services:
  postgres:
    image: postgres:16-alpine

    restart: unless-stopped

    env_file:
      - .env
    
    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    image: vanlife-api:migrate

    build:
      context: .
      target: builder

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    command: ["pnpm", "db:deploy"]

    restart: "no"

  api:
    image: vanlife-api:latest

    build:
      context: .
      target: runner

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    ports:
      - "8000:8000"

    restart: unless-stopped

volumes:
  postgres_data:
